[project]
name = "github-iq-backend"
version = "0.1.0"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["B008", "B904", "B007"]  # FastAPI Depends() is intentional; B904/B007 are style choices
fixable = ["I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
